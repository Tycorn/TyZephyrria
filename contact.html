<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ty Zephyrria</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="contact.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="banner-placeholder"></div>

    <div class="main-content">
        <div id="nav-placeholder"></div>

        <main class="page-content">
            <h2 class="page-title">Contactez-moi</h2>

            <div class="contact-container">
                <div class="contact-intro">
                    <p>Une question ? Un projet de création sur mesure ? Ou simplement l'envie de partager un retour sur
                        mon univers ?</p>
                    <p>N'hésitez pas à m'envoyer un message via le formulaire ci-dessous. Je vous répondrai avec plaisir
                        dans les plus brefs délais.</p>
                </div>

                <form id="contactForm" action="https://formspree.io/f/xzdonwbg" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Votre Nom Prénom</label>
                        <input type="text" id="name" name="name" placeholder="Ex: Jean Dupont" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Votre Email</label>
                        <input type="email" id="email" name="email" placeholder="Ex: jean.dupont@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Sujet</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Choisissez un sujet</option>
                            <option value="creation">Création artisanale</option>
                            <option value="photo">Photographie / Prestation</option>
                            <option value="graphisme">Graphisme / Identité visuelle</option>
                            <option value="auteur">Auto-édition / Illustrations</option>
                            <option value="autre">Autre demande</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Votre Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Comment puis-je vous aider ?"
                            required></textarea>
                    </div>

                    <!-- Case d'ajout de fichier/photo -->
                    <div class="form-group">
                        <label for="attachment">Ajouter une image / photo (optionnel)</label>
                        <div class="file-upload-wrapper">
                            <label class="file-upload-btn" for="attachment">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="upload-icon">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>Choisir un fichier</span>
                            </label>
                            <input type="file" id="attachment" accept="image/*" style="display: none;">
                            <span id="file-name-display" class="file-name-display">Aucun fichier sélectionné</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Envoyer mon message</button>
                </form>
            </div>

            <div id="social-placeholder"></div>
        </main>
    </div>

    <div id="pre-footer-placeholder"></div>
    <div id="back-to-top-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
    <script>
        // Met à jour l'affichage du nom du fichier sélectionné
        const attachmentInput = document.getElementById('attachment');
        const fileNameDisplay = document.getElementById('file-name-display');

        attachmentInput.addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "Aucun fichier sélectionné";
            fileNameDisplay.textContent = fileName;
        });

        // Envoi automatique de la photo vers l'hébergeur gratuit ImgBB
        const contactForm = document.getElementById('contactForm');
        const submitBtn = contactForm.querySelector('.submit-btn');

        contactForm.addEventListener('submit', async function(e) {
            // Si un fichier est sélectionné, on gère l'upload direct (ImgBB gère nativement le CORS)
            if (attachmentInput.files && attachmentInput.files[0]) {
                e.preventDefault(); // On bloque l'envoi immédiat vers Formspree

                // Clé API gratuite obtenue sur ImgBB
                const IMGBB_API_KEY = "9f09321db0b48d11ae850de99d62b32e";

                const file = attachmentInput.files[0];

                // Limite optionnelle de taille (32 Mo max pour ImgBB)
                if (file.size > 32 * 1024 * 1024) {
                    alert("L'image est trop volumineuse. Veuillez choisir un fichier de moins de 32 Mo.");
                    return;
                }

                // Changement de l'état du bouton d'envoi
                const originalBtnText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = "Téléchargement de votre photo...";

                // Préparation de la requête pour ImgBB
                const formData = new FormData();
                formData.append("image", file);

                try {
                    // Appel direct à l'API ImgBB (CORS est ouvert et autorisé nativement)
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const imageUrl = result.data.url; // L'adresse de l'image sur internet

                        // On insère l'URL proprement dans le message du client
                        const messageTextarea = document.getElementById('message');
                        messageTextarea.value += `\n\n--- FICHIER ATTACHÉ DU CLIENT ---\nModèle ou dessin à graver/broder : ${imageUrl}`;

                        submitBtn.textContent = "Envoi du message...";
                        
                        // Soumission finale du formulaire vers Formspree
                        contactForm.submit();
                    } else {
                        const errData = await response.json();
                        throw new Error(errData.error.message || "Erreur de réponse de l'API");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Nous n'avons pas pu envoyer la photo à cause de l'erreur : " + error.message + ".\n\nVotre message va être envoyé sans celle-ci.");
                    submitBtn.textContent = "Envoi en cours...";
                    contactForm.submit();
                }
            }
        });
    </script>
</body>

</html>
